name: Migration Preview

on:
  pull_request:
    paths:
      - 'migrations/**'

jobs:
  preview-migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout nes-db
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Jawafdehi/NepalEntityService-database
          path: nes-db
      
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Show pending migrations
        run: |
          export NES_DB_URL=file://${{ github.workspace }}/nes-db/v2
          nes migration list --pending
      
      - name: Run migrations
        id: run
        continue-on-error: true
        run: |
          export NES_DB_URL=file://${{ github.workspace }}/nes-db/v2
          echo y | nes migration run --all 2>&1 | tee migration_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: 'Upload Artifact'
        id: artifact-upload-step
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-logs
          path: nes-db/v2/migration-logs
      
      - name: Post results
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = `${{ steps.artifact-upload-step.outputs.artifact-url }}`;
            
            let output = '';
            try {
              output = fs.readFileSync('migration_output.txt', 'utf8');
              if (output.length > 65536) {
                output = output.substring(0, 65536) + '\n\n... (output truncated)';
              }
            } catch (error) {
              output = 'No migration output found';
            }
            
            const exitCode = '${{ steps.run.outputs.exit_code }}';
            const success = exitCode === '0';
            const status = success ? '✅ Migration Preview' : '⚠️ Migration Preview';
            
            const body = `## ${status}
            
            \`\`\`
            ${output}
            \`\`\`
            
            📊 [View full logs](${runUrl})
            📦 [Download migration logs](${artifactUrl})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
